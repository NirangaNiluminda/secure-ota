[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "secure-ota-device"
version = "1.0.0"
description = "SecureOTA device agent — verifies firmware against an on-chain release registry before installing it"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }

# Deliberately empty. The domain, application and offline demo paths run on a
# bare Python install, which keeps the unit tests honest: they physically cannot
# reach a network or a chain.
dependencies = []

[project.optional-dependencies]
# Only needed to talk to a real network.
chain = ["web3>=6.15,<8"]
dev = ["pytest>=8.0", "pytest-cov>=5.0", "ruff>=0.5", "mypy>=1.10"]

[project.scripts]
secure-ota-device = "secure_ota_device.cli.main:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
secure_ota_device = ["infrastructure/blockchain/abi/*.json"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
addopts = "-q --strict-markers"

[tool.ruff]
line-length = 90
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "I", "N", "UP", "B", "A", "C4", "SIM", "PL", "RUF"]

[tool.mypy]
python_version = "3.10"
strict = true
mypy_path = "src"
